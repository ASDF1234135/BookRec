[project]
name = "bookrec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "torch",
    "faiss-cpu",
    "mlflow",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "httpx", "fastapi", "pydantic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "service"]
